<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EYFI Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0A0A;
    --surface: #131311;
    --surface-raised: #1A1A16;
    --line: #2B2B26;
    --lime: #C6F135;
    --orange: #FF7A1A;
    --cream: #F2F1EA;
    --muted: #8C8B82;
    --silver: #C4C2BC;
    --bronze: #C97B4A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 16px 16px;
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    padding: 0 0 60px;
  }
  .wrap{ max-width: 460px; margin: 0 auto; padding: 24px 18px 0; }

  .head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .brand img{ height:56px; width:56px; object-fit:contain; display:block; }
  .streak{ font-size:11.5px; color: var(--muted); background:var(--surface); border:1px solid var(--line); padding:5px 10px; border-radius:20px; }

  h1{ font-family:'Poppins'; font-weight:700; font-size:25px; line-height:1.18; margin-bottom:6px; }
  h1 em{ font-style:normal; color: var(--lime); }
  .sub{ font-family:'Playfair Display'; font-style:italic; color: var(--muted); font-size:15px; margin-bottom:20px; }

  .tabs{ display:flex; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:30px; padding:4px; margin-bottom:18px; }
  .tab{ flex:1; text-align:center; padding:9px 0; font-size:12.5px; font-weight:600; color:var(--muted); border-radius:24px; cursor:pointer; user-select:none; transition: background .15s, color .15s; }
  .tab.active{ background:var(--lime); color:#0A0A0A; }

  .podium{ display:flex; align-items:flex-end; gap:10px; margin-bottom:22px; }
  .p-card{ flex:1; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px 8px 14px; text-align:center; position:relative; }
  .p-card.first{ padding-top:22px; border:1.5px solid var(--lime); background: linear-gradient(180deg, rgba(198,241,53,0.08), var(--surface) 60%); }
  .p-card.second{ transform: translateY(14px); }
  .p-card.third{ transform: translateY(22px); }
  .p-rank{ position:absolute; top:-11px; left:50%; transform:translateX(-50%); width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Poppins'; font-weight:700; font-size:12px; color:#0A0A0A; }
  .p-card.first .p-rank{ background:var(--lime); width:28px; height:28px; font-size:13px; top:-14px; }
  .p-card.second .p-rank{ background:var(--silver); }
  .p-card.third .p-rank{ background:var(--bronze); }
  .p-avatar{ width:44px; height:44px; border-radius:50%; margin:6px auto 8px; display:flex; align-items:center; justify-content:center; font-family:'Poppins'; font-weight:700; font-size:14px; border:2px solid var(--line); background-image: radial-gradient(circle, rgba(255,255,255,0.18) 1px, transparent 1px); background-size:5px 5px; }
  .p-card.first .p-avatar{ width:54px; height:54px; border-color: var(--lime); font-size:17px; }
  .p-name{ font-size:12px; font-weight:600; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .p-college{ font-size:10px; color:var(--muted); margin-bottom:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .p-amt{ font-family:'Poppins'; font-weight:700; font-size:14px; color: var(--lime); }
  .p-card.first .p-amt{ font-size:17px; }

  .search{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:30px; padding:11px 16px; margin-bottom:12px; transition: border-color .15s; }
  .search:focus-within{ border-color: var(--lime); }
  .search input{ background:none; border:none; outline:none; color:var(--cream); font-size:13px; width:100%; font-family:'Inter'; }
  .search input::placeholder{ color: var(--muted); }
  .search svg{ flex-shrink:0; }
  .clear-btn{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px; line-height:1; padding:0 2px; display:none; }
  .clear-btn.show{ display:block; }

  .chips{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; max-height:82px; overflow-y:auto; padding-bottom:2px; }
  .chip{ font-size:12px; font-weight:500; padding:7px 14px; border-radius:20px; border:1px solid var(--line); color:var(--cream); background:transparent; white-space:nowrap; cursor:pointer; user-select:none; transition: all .12s; }
  .chip:hover{ border-color: var(--muted); }
  .chip.on{ background:var(--lime); color:#0A0A0A; border-color:var(--lime); font-weight:600; }

  .result-count{ font-size:11.5px; color:var(--muted); margin-bottom:10px; }
  .result-count b{ color:var(--cream); font-weight:600; }

  .rows{ background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:6px 14px; min-height:60px; }

  @keyframes fadeSlideIn{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .row, .p-card{ animation: fadeSlideIn .28s ease both; }
  .rows{ transition: min-height .2s ease; }
  .chip{ transition: background-color .15s ease, color .15s ease, border-color .15s ease; }
  .row{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .row:last-child{ border-bottom:none; }
  .r-rank{ width:24px; font-family:'Poppins'; font-weight:600; font-size:13px; color:var(--muted); text-align:center; flex-shrink:0; }
  .r-avatar{ width:34px; height:34px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex-shrink:0; font-family:'Poppins'; background-image: radial-gradient(circle, rgba(255,255,255,0.15) 1px, transparent 1px); background-size:5px 5px; }
  .r-info{ flex:1; min-width:0; }
  .r-name{ font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .r-name mark{ background: var(--lime); color:#0A0A0A; border-radius:2px; padding:0 1px; }
  .r-college{ font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .r-right{ text-align:right; flex-shrink:0; }
  .r-amt{ font-family:'Poppins'; font-weight:600; font-size:13.5px; }

  .empty-state{ text-align:center; padding:30px 10px; color:var(--muted); font-size:13px; }

  .self-row{
    position: sticky; bottom: 14px;
    max-width: 460px; margin: 18px auto 0;
    background: var(--lime); border-radius:20px;
    padding: 13px 16px;
    display:flex; align-items:center; gap:12px;
    cursor:pointer;
  }
  .self-row .r-rank{ color:#0A0A0A; opacity:0.65; }
  .self-row .r-avatar{ background-color:#0A0A0A; color:var(--lime); border:none; }
  .self-row .r-name, .self-row .r-amt{ color:#0A0A0A; }
  .self-row .r-college{ color: rgba(10,10,10,0.6); }
  .self-tag{ font-size:9.5px; font-weight:700; background:#0A0A0A; color:var(--lime); padding:2px 7px; border-radius:20px; margin-left:6px; letter-spacing:0.3px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="brand"><img id="logo-img" alt="EYFI"></div>
    <div class="streak">Day 12 of 30</div>
  </div>

  <h1>Who's <em>earning</em> the most right now?</h1>
  <div class="sub" id="sub-text">191 students hustling</div>

  <div class="tabs">
    <div class="tab active" data-tab="overall">Overall</div>
    <div class="tab" data-tab="week">This week</div>
    <div class="tab" data-tab="college">Your college</div>
  </div>

  <div class="podium" id="podium"></div>

  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8C8B82" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search-input" placeholder="Find yourself or a friend">
    <button class="clear-btn" id="clear-btn" aria-label="Clear search">&times;</button>
  </div>

  <div class="chips" id="chips"></div>

  <div class="result-count" id="result-count"></div>

  <div class="rows" id="rows"></div>

  <div class="self-row" id="self-row"></div>

</div>

<script>
const AVATAR_COLORS = ['#C6F135','#FF7A1A','#8C8B82','#F2F1EA'];
function avatarStyle(name){
  let hash = 0;
  for (let i=0;i<name.length;i++){ hash = name.charCodeAt(i) + ((hash<<5)-hash); }
  const color = AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
  const textColor = (color === '#8C8B82' || color === '#F2F1EA') ? '#0A0A0A' : '#0A0A0A';
  return `background-color:${color}; color:${textColor};`;
}

let STUDENTS = [];
let logoDataUri = "";

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(text, query){
  if (!query) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return escapeHtml(text);
  const before = escapeHtml(text.slice(0, idx));
  const match = escapeHtml(text.slice(idx, idx + query.length));
  const after = escapeHtml(text.slice(idx + query.length));
  return `${before}<mark>${match}</mark>${after}`;
}

let state = { query: "", college: "All", tab: "overall" };

function getFiltered(){
  let list = STUDENTS.slice();
  if (state.tab === "week"){
    list = list.slice().sort((a,b)=> b.weekAmount - a.weekAmount);
    list.forEach((s,i)=> s._rank = i+1);
  } else {
    list.forEach(s=> s._rank = s.rank);
  }
  if (state.college !== "All"){
    list = list.filter(s => s.college === state.college);
    list.forEach((s,i)=> s._rank = i+1);
  }
  if (state.query.trim()){
    const q = state.query.trim().toLowerCase();
    list = list.filter(s => s.name.toLowerCase().includes(q) || s.college.toLowerCase().includes(q));
  }
  return list;
}

function renderChips(){
  const counts = {};
  STUDENTS.forEach(s => counts[s.college] = (counts[s.college]||0)+1);
  const colleges = Object.keys(counts).sort((a,b)=> counts[b]-counts[a]);
  const el = document.getElementById('chips');
  let html = `<div class="chip ${state.college==='All'?'on':''}" data-college="All">All colleges</div>`;
  colleges.forEach(c => {
    html += `<div class="chip ${state.college===c?'on':''}" data-college="${escapeHtml(c)}">${escapeHtml(c)}</div>`;
  });
  el.innerHTML = html;
  el.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      state.college = chip.dataset.college;
      renderChips();
      render();
    });
  });
}

function render(){
  const filtered = getFiltered();
  const amtKey = state.tab === "week" ? "weekAmount" : "amount";

  // podium only shown for unfiltered overall/week top3, hide when searching or college-filtered narrows below 3
  const podiumEl = document.getElementById('podium');
  if (!state.query.trim() && filtered.length >= 3){
    const top3 = filtered.slice(0,3);
    const order = [top3[1], top3[0], top3[2]];
    const cls = ['second','first','third'];
    podiumEl.style.display = 'flex';
    podiumEl.innerHTML = order.map((s,i)=>`
      <div class="p-card ${cls[i]}" style="animation-delay:${i*40}ms">
        <div class="p-rank">${i===1?1:(i===0?2:3)}</div>
        <div class="p-avatar" style="${avatarStyle(s.name)}">${s.initials}</div>
        <div class="p-name">${escapeHtml(s.name)}</div>
        <div class="p-college">${escapeHtml(s.college)}</div>
        <div class="p-amt">₹${s[amtKey].toLocaleString('en-IN')}</div>
      </div>`).join('');
  } else {
    podiumEl.style.display = 'none';
  }

  const listStart = podiumEl.style.display === 'none' ? 0 : 3;
  const rest = filtered.slice(listStart, listStart + 40);

  const rowsEl = document.getElementById('rows');
  if (rest.length === 0){
    rowsEl.innerHTML = `<div class="empty-state">No one found. Try a different name or college.</div>`;
  } else {
    rowsEl.innerHTML = rest.map((s,i) => `
      <div class="row" style="animation-delay:${Math.min(i,10)*25}ms">
        <div class="r-rank">${s._rank}</div>
        <div class="r-avatar" style="${avatarStyle(s.name)}">${s.initials}</div>
        <div class="r-info">
          <div class="r-name">${highlight(s.name, state.query)}</div>
          <div class="r-college">${highlight(s.college, state.query)}</div>
        </div>
        <div class="r-right"><div class="r-amt">₹${s[amtKey].toLocaleString('en-IN')}</div></div>
      </div>`).join('');
  }

  document.getElementById('result-count').innerHTML =
    state.query.trim() || state.college !== "All"
      ? `<b>${filtered.length}</b> ${filtered.length===1?'student':'students'} match${state.college!=='All' ? ' · '+escapeHtml(state.college) : ''}`
      : `<b>${STUDENTS.length}</b> students ranked`;

  // self row
  const you = STUDENTS.find(s => s.self);
  const selfEl = document.getElementById('self-row');
  const youRankInView = state.tab === "week" ? STUDENTS.slice().sort((a,b)=>b.weekAmount-a.weekAmount).findIndex(s=>s.self)+1 : you.rank;
  selfEl.innerHTML = `
    <div class="r-rank">${youRankInView}</div>
    <div class="r-avatar">${you.initials}</div>
    <div class="r-info"><div class="r-name">You <span class="self-tag">YOU</span></div><div class="r-college">${escapeHtml(you.college)}</div></div>
    <div class="r-right"><div class="r-amt">₹${you[amtKey].toLocaleString('en-IN')}</div></div>`;

  document.getElementById('clear-btn').classList.toggle('show', state.query.length > 0);
}

function init(students, logoUri){
  STUDENTS = students;
  logoDataUri = logoUri;
  document.getElementById('logo-img').src = logoDataUri;
  document.getElementById('sub-text').textContent = `${STUDENTS.length} students hustling`;

  document.getElementById('search-input').addEventListener('input', (e)=>{
    state.query = e.target.value;
    render();
  });
  document.getElementById('clear-btn').addEventListener('click', ()=>{
    state.query = "";
    document.getElementById('search-input').value = "";
    render();
  });
  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      state.tab = tab.dataset.tab;
      if (state.tab === 'college'){
        const you = STUDENTS.find(s=>s.self);
        state.college = you.college;
      } else {
        state.college = "All";
      }
      renderChips();
      render();
    });
  });

  renderChips();
  render();
}

window.__EYFI_INIT__ = init;
</script>
